007-sram_rgn0_2_start_addr:10:0x3FF=lineEdit16-sram_rgn0_2起始地址，单位：page（1kB/page）。sram_rgn0_2区域大于等于起始地址，小于等于结束地址。*0xE：地址0x0200_3800；*…*0x3F：地址0x0200_FC00；*其他：无效配置。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程，不可擦除。*当info_rgn2_Y_unlcok (Y=0~6)任意一个编程为0时，锁定。不可擦除。
