0CA-main_rgn0_2_protection_level:8:0xFF=lineEdit16-main rgn0_2保护等级。*0xFF：Level0，无保护；*其他：Level1，保护main rgn0_2。仅允许CPU执行main rgn0_1中的以main_rgn0_2_code_end为结束地址的代码段，禁止CPU读写代码段数据。禁止JTAG访问main rgn0_2区域。禁止通过eflash控制器读写擦main rgn0_2。当info_rgn3_6未锁定时，支持main_rgn0_2_protection_level回退自毁机制：软件可向FOTPC发起回退请求，FOTPC依次擦除eflash main rgn0_2和info_rgn3。*注意：若main rgn0_2和main rgn0_1/3/4存在交叉重叠，main rgn0_2回退时，会擦除交叉重叠区域。
