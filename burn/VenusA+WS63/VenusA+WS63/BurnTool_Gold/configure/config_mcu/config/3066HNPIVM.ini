[transmissionMode]           ;;传输方式 名称=类型 类型用于展示配置项
0-SWD=3
1-UART=0
2-UART(USB)=1
3-JTAG=2
4-SPI=4
5-I2C=5
6-CAN=6


[info]                          ;;分区信息
Main_rgn address: = 0x3000000
Main_rgn size: = 512KB
info_rgn1 address: = 0x3800400
info_rgn1 size: = 1KB
info_rgn2 address: = 0x3800800
info_rgn2 size: = 1KB
info_rgn3 address: = 0x3800C00
info_rgn3 size: = 1KB
info_rgn5 address: = 0x3805000
info_rgn5 size: = 4KB
info_rgn6 address: = 0x3806000
info_rgn6 size: = 4KB
info_rgn7 address: = 0x3807400
info_rgn7 size: = 1KB
info_rgn8 address: = 0x3807800
info_rgn8 size: = 1KB
info_rgn9 address: = 0x3807C00
info_rgn9 size: = 1KB

[mainInfo]
startAddress=0x3000000            ;;整片开始地址
size=1024                          ;;整片大小(KB)
uploadStartAddress = 0x3000000    ;;读取默认地址
uploadSize = 1024                  ;;读取默认大小(KB)
infoStartAddress=0x3800000        ;;info分区开始地址
bankSize = 16                     ;;块大小（KB）

[loaderInfo]
sram_start_address=0x2003800
sram_end_address=0x2008000

[baudRate]                       ;;波特率
0-115200=115200
1-2400=2400
2-4800=4800
3-9600=9600
4-38400=38400
5-57600=57600
6-230400=230400

[I2CBaudRate]                       ;;I2C速率选项
0-400K=400000
1-100K=100000

[SPIBaudRate]                       ;;SPI速率选项
0-1.1M=32
1-140K=256
1-280K=128
1-560K=64
1-2.2M=16

[canbaudRate]                       ;;CAN波特率
0-125K=125
1-100K=100
2-200K=200
3-250K=250
4-500K=500
5-1M=1000

[frequencies]                       ;;频率
0-2M=2000
1-6M=6000
2-10M=10000

[debugMode]                       ;;调试器型号
0-HiSpark-Trace=0
1-HiSpark-Link=1

[targetInfo]                       ;;烧录默认值
address=0x3000000

[chipInfo]                            ;;芯片信息 get获取的info（chipId、versionId必须）
0-versionId:16 = 0
1-protocolVersion:8 = 0
2-getChipID:8 = 0
3-getCMD:8 = 0
4-readCMD:8 = 0
5-writeCMD:8 = 0
6-eraseCMD:8 = 0
7-goCMD:8 = 0
8-protectCMD:8 = 0
9-unprotectCMD:8 = 0
10-resetCMD:8 = 0

[parameterInfo]                ;;记录参数信息
chipIdAddress = 0x3800020                    ;;chipId开始地址（jtag/swd使用）
chipIdSize = 4                                ;;chipId长度（byte）
eraseBaseNum = 1024                          ;;擦除对齐字节（byte）

[infoPart]
0-info1=2
1-info2=4
2-info3=8
4-info5=128
5-info6=64
6-info7=16
7-info8=32
8-info9=256

[info1RuleMaxValue]                ;;参数最大值限制小于等于该值（十六进制）
main_rgn0_size=0x3ff

[info2RuleMaxValue]                ;;参数最大值限制小于等于该值（十六进制）
sram_rgn0_1_start_addr=0x3FF
sram_rgn0_1_end_addr=0x3FF
sram_rgn0_1_cpsrc_addr=0x3FF

[info3RuleMaxValue]                ;;参数最大值限制小于等于该值（十六进制）
