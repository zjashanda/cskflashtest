000-名称=值-描述
001-main_rgn0_2_start_addr:10:0x3FF=lineEdit16-main_rgn0_2起始地址，单位：page（1kB/page）。*0x1：地址0x0300_0400；*0x2：地址0x0300_0800；*…*0x1FF：地址0x0307_FC00；*其他：无效配置。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程，不可擦除。*当info_rgn2_Y_unlcok (Y=0~6)任意一个编程为0时，锁定。不可擦除。
002-reserved:6:0x00=hide-无效，读恒为0
003-main_rgn0_2_end_addr:10:0x3FF=lineEdit16-main_rgn0_2结束地址，单位：page（1kB/page）。*0x1：地址0x0300_07FF；*0x2：地址0x0300_0BFF；*…*0x1FF：地址0x0307_FFFF；*其他：无效配置。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程，不可擦除。*当info_rgn2_Y_unlcok (Y=0~6)任意一个编程为0时，锁定。不可擦除。
