[transmissionMode]           ;;传输方式 名称=类型 类型用于展示配置项
0-SWD=3
1-UART=0
2-UART(USB)=1
3-JTAG=2
4-SPI=4
5-I2C=5
6-CAN=6


[info]                          ;;分区信息
Main_rgn address: = 0x3000000
Main_rgn size: = 64KB
info_rgn1 address: = 0x3801000
info_rgn1 size: = 2KB

[mainInfo]
startAddress=0x3000000            ;;整片开始地址
size=64                          ;;整片大小 128KB
uploadStartAddress = 0x3000000    ;;读取默认地址
uploadSize = 64                  ;;读取默认大小KB
infoStartAddress=0x3800000        ;;info分区开始地址
bankSize = 1                      ;;块大小（KB）
[loaderInfo]
sram_start_address=0x2003800
sram_end_address=0x2008000

[baudRate]                       ;;波特率
0-115200=115200
1-2400=2400
2-4800=4800
3-9600=9600
4-38400=38400
5-57600=57600
6-230400=230400

[I2CBaudRate]                       ;;I2C速率选项
0-400K=400000
1-100K=100000

[SPIBaudRate]                       ;;SPI速率选项
0-1.1M=32
1-140K=256
1-280K=128
1-560K=64
1-2.2M=16

[canbaudRate]                       ;;CAN波特率
0-125K=125
1-100K=100
2-200K=200
3-250K=250
4-500K=500
5-1M=1000

[frequencies]                       ;;频率
0-2M=2000
1-6M=6000
2-10M=10000

[debugMode]                       ;;调试器型号
0-HiSpark-Trace=0
1-HiSpark-Link=1

[targetInfo]                       ;;烧录默认值
address=0x3000000

[chipInfo]                            ;;芯片信息 get获取的info（chipId、versionId必须）
0-versionId:16 = 0
1-protocolVersion:8 = 0
2-getChipID:8 = 0
3-getCMD:8 = 0
4-readCMD:8 = 0
5-writeCMD:8 = 0
6-eraseCMD:8 = 0
7-goCMD:8 = 0
8-protectCMD:8 = 0
9-unprotectCMD:8 = 0
10-resetCMD:8 = 0

[parameter]                    ;;参数配置（key：number:defaultValue = type-description）key: 名称 :number 表示位域 defaultValue:表示默认值（16进制） type：输入框类型（checkBox：勾选框类型, lineEdit16: 16进制输入框,hide不显示））description：描述信息
0-名称=值-描述
1-protection_level:8:0xFF=lineEdit16-权限管理标志。*0xFF：level0。FUNC_JTAG权限开放；*Others：level1。FUNC_JTAG权限受限，只能访问FOTPC/EFC寄存器空间以及读写擦eflash main rgn1。*当info_rgn1_unlock处于未锁定时，protection_level支持回退自毁机制：通过向FOTPC发起回退请求，会依次擦除eflash main0/1_rgn和info_rgn1。
2-reserved:24:0x000000=hide-无效，读恒为0
3-reserved:16:0x0000=hide-无效，读恒为0
4-reserved:16:0x0000=hide-无效，读恒为0
5-reserved:16:0x0000=hide-无效，读恒为0
6-reserved:16:0x0000=hide-无效，读恒为0
7-reserved:16:0x0000=hide-无效，读恒为0
8-reserved:16:0x0000=hide-无效，读恒为0
9-uart0_enable:1:0x1=lineEdit16-UART0使能标志。*0：禁用；*1：使能。
A-uart1_enable:1:0x1=lineEdit16-UART1使能标志。*0：禁用；*1：使能。
B-uart2_enable:1:0x1=lineEdit16-UART2使能标志。*0：禁用；*1：使能。
C-uart3_enable:1:0x1=lineEdit16-UART3使能标志。*0：禁用；*1：使能。
D-reserved:28:0x0000000=hide-无效，读恒为0
E-func_jtag_enable:8:0xFF=lineEdit16-FUNC JTAG使能标志。*Others: 禁止；*0xFF: 允许。*禁止：无法通过FUNC JTAG访问芯片；*允许：可以通过FUNC JTAG访问芯片。
F-sysram_parity_disable:1:0x1=lineEdit16-SYSRAM奇偶校验使能标志。*1：禁用；*0：使能。
G-reserved:23:0x000000=hide-无效，读恒为0
H-uart_boot_enable:1:0x1=lineEdit16-UART BOOT使能标志。*0：禁用；*1：使能。*禁用状态下，bootrom无法通过UART0进行串口升级。
I-spi_boot_enable:1:0x1=lineEdit16-SPI BOOT升级使能标志。*0：禁用，bootrom无法通过SPI进行升级；*1：使能，bootrom可以通过SPI进行升级。
J-i2c_boot_enable:1:0x1=lineEdit16-I2C BOOT升级使能标志。*0：禁用，bootrom无法通过I2C进行串口升级；*1：使能，bootrom可以通过I2C进行串口升级。
K-can_boot_enable:1:0x1=lineEdit16-CAN BOOT升级使能标志。*0：禁用，bootrom无法通过CAN进行串口升级；*1：使能，bootrom可以通过CAN进行串口升级。
L-reserved:28:0x000000=hide-无效，读恒为0
M-main_rgn0_size:10:0x3FF=lineEdit16-main rgn0容量大小配置，单位：page（3061：1KB/page）。*main rgn中小于等于main_rgn0_size的page属于main rgn0，大于main_rgn0_size的page属于main rgn1。
N-reserved:22:0x000000=hide-无效，读恒为0
O-info_rgn1_unlock:8:0xFF=lineEdit16-info_rgn1区域锁定标志。*0xFF：未锁定；*其它值：锁定。*锁定状态下，无法对info_rgn1区域进行擦除、编程操作，不支持生命周期回退功能。
P-reserved:24:0x000000=hide-无效，读恒为0

[parameterInfo]                ;;记录参数信息
flashProtectionName = protection_level-0xff ;;flash保护名称-解保护值
parameterStartAddress = 0x3801000            ;;参数开始地址
chipIdAddress = 0x3800020                    ;;chipId开始地址（jtag/swd使用）
chipIdSize = 4                                ;;chipId长度（byte）

[parameterEnableValue]     ;;参数使能的值
protection_level = 0xFF
uart0_enable = 0x1
uart1_enable = 0x1
uart2_enable = 0x1
uart3_enable = 0x1
func_jtag_enable = 0xFF
sysram_parity_disable = 0x0
uart_boot_enable = 0x1
spi_boot_enable = 0x1
i2c_boot_enable = 0x1
can_boot_enable = 0x1
info_rgn1_unlock = 0xFF

[JTAGInfo]
targetFileJTAG=CHIP-MCU/3061MNNIC8-jtag.cfg    ;;jtag文件地址
targetFileSWD=CHIP-MCU/3061MNNIC8-swd.cfg   ;;swd文件地址
targetFileInfoJTAG = CHIP-MCU/3061MNNIC8_INFO1-jtag.cfg    ;;jtag info文件地址
targetFileInfoSWD = CHIP-MCU/3061MNNIC8_INFO1-swd.cfg    ;;jtag info文件地址