[transmissionMode]           ;;传输方式 名称=类型 类型用于展示配置项
0-SWD=3
1-UART=0
2-UART(USB)=1
3-JTAG=2
4-SPI=4
5-I2C=5
6-CAN=6

[baudRate]                       ;;波特率
0-115200=115200
1-2400=2400
2-4800=4800
3-9600=9600
4-38400=38400
5-57600=57600
6-230400=230400

[canbaudRate]                       ;;CAN波特率
0-125K=125
1-100K=100
2-200K=200
3-250K=250
4-500K=500
5-1M=1000

[frequencies]                       ;;频率
0-2M=2000
1-6M=6000
2-10M=10000

[debugMode]                       ;;调试器型号
0-hiSparke_trace=0
1-hiSparke_link=1

[I2CBaudRate]                       ;;I2C速率选项
0-400K=400000
1-100K=100000

[SPIBaudRate]                       ;;SPI速率选项
0-1.1M=32
1-140K=256
1-280K=128
1-560K=64
1-2.2M=16

[parameterInfo]                ;;记录参数信息
chipIdAddress = 0x3800020                    ;;chipId开始地址（jtag/swd使用）
chipIdSize = 4                                ;;chipId长度（byte）