[info1parameterEnableValue]     ;;参数使能的值
main_rgn0_0_protection_level = 0xFF
uart0_enable = 0x1
uart1_enable = 0x1
uart2_enable = 0x1
uart3_enable = 0x1
uart4_enable = 0x1
iwdg_deepsleep = 0x1
iwdg_sw = 0x1
func_jtag_enable = 0xFF
sysram_parity_disable = 0x0
uart_boot_enable = 0x1
spi_boot_enable = 0x1
i2c_boot_enable = 0x1
can_boot_enable = 0x1
smbus_boot_enable = 0x1
main_rgn0_0_size = 0x3FF
info_rgn1_0_unlock = 0x1
info_rgn1_1_unlock = 0x1
info_rgn1_2_unlock = 0x1
info_rgn1_3_unlock = 0x1
info_rgn1_4_unlock = 0x1
info_rgn1_5_unlock = 0x1
info_rgn1_6_unlock = 0x1

[info2parameter]                    ;;参数配置（key：number:defaultValue = type-description）key: 名称 :number 表示位域 defaultValue:表示默认值（16进制）type：输入框类型（checkBox：勾选框类型, lineEdit16: 16进制输入框,hide不显示））description：描述信息
000-名称=值-描述
001-main_rgn0_1_start_addr:10:0x3FF=lineEdit16-main_rgn0_1起始地址，单位：page（1KB/page）。*0x0：地址0x0300_0000；*0x1：地址0x0300_0400；*0x2：地址0x0300_0800；*…*0x1FF：地址0x0307_FC00。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程。*当info_rgn2_Y_unlcok编程为0时 (Y=0~3)，锁定。不可擦除。   
002-reserved:6:0x00=hide-无效，读恒为0
003-main_rgn0_1_end_addr:10:0x3FF=lineEdit16-main_rgn0_1结束地址，单位：page（1KB/page）。*0x0：地址0x0300_03FF；*0x1：地址0x0300_07FF；*0x2：地址0x0300_0BFF；*…*0x1FF：地址0x0307_FFFF。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程。*当info_rgn2_Y_unlcok编程为0时 (Y=0~3)，锁定。不可擦除。
004-reserved:6:0x00=hide-保留
005-main_rgn0_1_code_end:10:0x3FF=lineEdit16-main_rgn0_1里的代码段结束地址，单位：page（1KB/page）。*0x0：地址0x0300_03FF；*0x1：地址0x0300_07FF；*0x2：地址0x0300_0BFF；*…*0x1FF：地址0x0307_FFFF。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程。*当info_rgn2_Y_unlcok编程为0时 (Y=0~3)，锁定。不可擦除。
006-reserved:14:0x0000=hide-保留
007-main_rgn0_1_protection_level:8:0xFF=lineEdit16-main rgn0_1保护等级。*0xFF：Level0，无保护；*其他：Level1，保护main rgn0_1。仅允许CPU执行main rgn0_1中的以main_rgn0_1_code_end为结束地址的代码段，禁止CPU读写代码段数据。禁止JTAG访问main rgn0_1区域。禁止通过eflash控制器读写擦main rgn0_1。当info_rgn2_0未锁定时，支持main_rgn0_1_protection_level回退自毁机制：软件可向FOTPC发起回退请求，FOTPC依次擦除eflash main rgn0_1和info_rgn2。*注意：若main rgn0_1和main rgn0_2存在交叉重叠，main rgn0_1回退时，会擦除交叉重叠区域。
008-sram_rgn0_1_start_addr:10:3FF=lineEdit16-sram_rgn0_1起始地址，单位：page（1KB/page）。sram_rgn1区域大于等于起始地址，小于等于结束地址。*0xE：地址0x0200_3800；*…*0x3F：地址0x0200_FC00；*其他：无效配置。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程。当info_rgn2_Y_unlcok编程为0时 (Y=0~3)，锁定。不可擦除。
009-reserved:6:0x00=hide-保留
00A-sram_rgn0_1_end_addr:10:0x3FF=lineEdit16-sram_rgn0_1结束地址，单位：page（1KB/page）。sram_rgn1区域大于等于起始地址，小于等于结束地址。*0xE：地址0x0200_3BFF；*…*0x3F：地址0x0200_FFFF；*其他：无效配置。*当info_rgn2_0_unlcok编程为0时，锁定，不可编程。当info_rgn2_Y_unlcok编程为0时 (Y=0~3)，锁定。不可擦除。
00B-reserved:6:0x00=hide-保留
00C-sram_rgn0_1_cpsrc_addr:10:0x3FF=lineEdit16-拷贝到sram_rgn0_1的源数据起始地址。拷贝的大小是sram_rgn0_1_end_addr0 - sram_rgn0_1_start_addr。
00D-reserved:14:0x0000=hide-保留
00E-sram_rgn0_1_disable:8:0xFF=lineEdit16-sram_rgn0_1保护。*0xFF：不保护；*其他：保护，sram_rgn0_1仅可执行，仅允许CPU执行sram_rgn0_1。
