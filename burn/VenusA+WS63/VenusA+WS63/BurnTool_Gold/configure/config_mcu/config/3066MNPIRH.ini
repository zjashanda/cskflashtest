001-main_rgn0_0_protection_level:8:0xFF=lineEdit16-main rgn0_0权限管理标志，保护等级。*0xFF：JTAG/SWD接口权限开放；*其他：JTAG/SWD接口权限受限，只能访问Flash寄存器空间，读写擦eflash main rgn1区域，以及读取info_rgn0/1区域。*当info_rgn1_0_unlock处于未锁定时，支持main_rgn0_0_protection_level回退自毁机制：软件可向FOTPC发起回退请求，FOTPC擦除main区域中非main rgn0_1和main rgn0_2的其余区域，以及info_rgn1。注意：若main rgn0_0与main_rgn0_1（或者main rgn0_2）交叉重叠，交叉重叠部分受到2个区域同时保护，main rgn0_0回退时，不擦除main rgn0_1和main rgn0_2。
