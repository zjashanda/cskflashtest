[info3parameter]                    ;;参数配置（key：number:defaultValue = type-description）key: 名称 :number 表示位域 defaultValue:表示默认值（16进制）type：输入框类型（checkBox：勾选框类型, lineEdit16: 16进制输入框,hide不显示））description：描述信息
000-名称=值-描述
001-main_rgn0_2_start_addr:10:0x3FF=lineEdit16-main_rgn0_2起始地址，单位：page（1KB/page）。*0x0：地址0x0300_0000；*0x1：地址0x0300_0400；*0x2：地址0x0300_0800；*…*0x1FF：地址0x0307_FC00。*当info_rgn2_4_unlcok编程为0时，锁定，不可编程，不可擦除。*当info_rgn2_Y_unlcok (Y=5~7)任意一个编程为0时，锁定。不可擦除。  
002-reserved:6:0x00=hide-无效，读恒为0
003-main_rgn0_2_end_addr:10:0x3FF=lineEdit16-main_rgn0_2结束地址，单位：page（1KB/page）。*0x0：地址0x0300_03FF；*0x1：地址0x0300_07FF；*0x2：地址0x0300_0BFF；*…*0x1FF：地址0x0307_FFFF。*当info_rgn2_4_unlcok编程为0时，锁定，不可编程，不可擦除。*当info_rgn2_Y_unlcok (Y=5~7)任意一个编程为0时，锁定。不可擦除。
004-reserved:6:0x00=hide-保留
005-main_rgn0_2_code_end:10:0x3FF=lineEdit16-main_rgn0_2里的代码段结束地址，单位：page（1KB/page）。*0x0：地址0x0300_03FF；*0x1：地址0x0300_07FF；*0x2：地址0x0300_0BFF；*…*0x1FF：地址0x0307_FFFF。*当info_rgn2_4_unlcok编程为0时，锁定，不可编程，不可擦除。*当info_rgn2_Y_unlcok (Y=5~7)任意一个编程为0时，锁定。不可擦除。
006-reserved:14:0x0000=hide-保留
007-main_rgn0_2_protection_level:8:0xFF=lineEdit16-main_rgn0_2保护等级。*0xFF：Level0，无保护；*其他：Level1，保护main rgn0_2。仅允许CPU执行main rgn0_2中的以main_rgn0_2_code_end为结束地址的代码段，禁止CPU读写代码段数据。禁止JTAG访问main rgn0_2区域。禁止通过eflash控制器读写擦main rgn0_2，FOTPC除外。当info_rgn3_0未锁定时，支持main_rgn0_2_protection_level回退自毁机制：软件可向FOTPC发起回退请求，FOTPC会依次擦除eflash main rgn0_2和info_rgn3。注意：若main rgn0_1和main rgn0_2存在交叉重叠，main rgn0_2回退时，会擦除交叉重叠区域。
008-sram_rgn0_2_start_addr:10:0x3FF=lineEdit16-sram_rgn0_2起始地址，单位：page（1KB/page）。sram_rgn0_2区域大于等于起始地址，小于等于结束地址。*0xE：地址0x0200_3800；*…*0x3F：地址0x0200_FC00；*其他：无效配置。*当info_rgn2_4_unlcok编程为0时，锁定，不可编程，不可擦除。当info_rgn2_Y_unlcok (Y=5~7)任意一个编程为0时，锁定。不可擦除。
