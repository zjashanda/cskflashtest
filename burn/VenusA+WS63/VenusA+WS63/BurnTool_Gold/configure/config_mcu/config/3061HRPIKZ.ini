[transmissionMode]           ;;传输方式 名称=类型 类型用于展示配置项
0-SWD=3
1-UART=0
2-UART(USB)=1
3-JTAG=2

[info]                          ;;分区信息
Main_rgn0 address = 0x3000000
Main_rgn0 size = 152KB
Main_rgn1 address = 0x3026000
Main_rgn1 size = 8KB
info_rgn1 address = 0x3802000
info_rgn1 size = 8KB

[mainInfo]
startAddress=0x3000000            ;;整片开始地址
size=152                          ;;整片大小KB
uploadStartAddress = 0x3000000    ;;读取默认地址
uploadSize = 152                  ;;读取默认大小KB
infoStartAddress=0x3800000        ;;info分区开始地址
bankSize = 8                      ;;块大小（KB）

[baudRate]                       ;;波特率
0-115200=115200
1-2400=2400
2-4800=4800
3-9600=9600
4-19200=19200
5-38400=38400
6-57600=57600


[frequencies]                       ;;频率
0-2M=2000
1-6M=6000
2-10M=10000

[debugMode]                       ;;调试器型号
0-HiSpark-Trace=0
1-HiSpark-Link=1

[targetInfo]                       ;;烧录默认值
address=0x3000000

[loaderInfo]                       
path=loader/loader.bin                ;;loader.bin地址
address=0x2000000                    ;;loader.bin烧写地址

[chipInfo]                            ;;芯片信息 get获取的info（chipId、versionId必须）

[parameter]                    ;;参数配置（key：number:defaultValue = type-description）key: 名称 :number 表示位域 defaultValue:表示默认值（16进制）type：输入框类型（checkBox：勾选框类型, lineEdit16: 16进制输入框,hide不显示））description：描述信息
0-名称=值-描述
1-protection_level:1:0x1=lineEdit16-protection_level 权限管理标志。*0：JTAG 权限受限（FUNC_JTAG 只能访问SYSRAM/FLASH 寄存器空间/FLASH main rgn last page）；*1：JTAG 权限开放（FUNC_JTAG 无访问限制）。*当 info_rgn1_unlock 处于未锁定时，支持回退自毁机制：通过 FUNC_JTAG 向 FLASH 发起protection_level 回退请求，会擦除 eflash info_rgn1 和整个 main_rgn 区。
2-reserved:15:0x7FFF=hide-保留
3-reserved:16:0xFFFF=hide-保留
4-reserved:16:0xFFFF=hide-保留
5-reserved:16:0xFFFF=hide-保留
6-reserved:16:0xFFFF=hide-保留
7-reserved:16:0xFFFF=hide-保留
8-reserved:16:0xFFFF=hide-保留
9-reserved:16:0xFFFF=hide-保留
A-uart0_enable:1:0x1=lineEdit16-UART0使能标志。*0：禁用；*1：使能。
B-uart1_enable:1:0x1=lineEdit16-UART1使能标志。*0：禁用；*1：使能。
C-uart2_enable:1:0x1=lineEdit16-UART2使能标志。*0：禁用；*1：使能。
D-reserved:29:0x1FFFFFFF=hide-保留
E-func_jtag_enable:1:0x1=lineEdit16-FUNC JTAG 使能标志。*0：禁用；*1：使能。
F-reserved:31:0x7FFFFFFF=hide-保留
G-uart_boot_enable:1:0x1=lineEdit16-UART0 BOOT 使能标志。*0：禁用；*1：使能。*禁用状态下，bootrom 无法通过 UART0 进行串口升级。
H-reserved:15:0x7FFF=hide-保留
I-reserved:16:0xFFFF=hide-保留
J-reserved:16:0xFFFF=hide-保留
K-reserved:16:0xFFFF=hide-保留
L-info_rgn1_unlock:1:0x1=lineEdit16-nfo_rgn1 锁定标志。*0：锁定；*1：未锁定。*锁定状态下，无法对 info_rgn1 区域进行擦除、编程操作，不支持 protection level 回退功能。
M-reserved:31:0x7FFFFFFF=hide-保留

[parameterInfo]                ;;记录参数信息
flashProtectionName = protection_level-0x1 ;;flash保护名称-解保护值
parameterStartAddress = 0x3802000            ;;参数开始地址
chipIdAddress = 0x3800020                    ;;chipId开始地址（jtag/swd使用）
chipIdSize = 4                                ;;chipId长度（byte）

[parameterEnableValue]     ;;参数使能的值
protection_level = 0x1
uart0_enable = 0x1
uart1_enable = 0x1
uart2_enable = 0x1
func_jtag_enable = 0xFF
uart_boot_enable = 0x1
info_rgn1_unlock = 0xFF

[JTAGInfo]
targetFileJTAG=CHIP-MCU/3061HRPIKZ-jtag.cfg
targetFileSWD=CHIP-MCU/3061HRPIKZ-swd.cfg
targetFileInfoJTAG = CHIP-MCU/3061HRPIKZ_INFO1-jtag.cfg    ;;jtag info文件地址
targetFileInfoSWD = CHIP-MCU/3061HRPIKZ_INFO1-swd.cfg    ;;jtag info文件地址